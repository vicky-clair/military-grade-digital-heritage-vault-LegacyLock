[package]
name = "vault-cli"
version = "0.1.0"
edition = "2021"
description = "LegacyLock Military-grade Digital Heritage Vault Cryptographic Core"

[lib]
name = "vault_core"
path = "src/lib.rs"

[[bin]]
name = "vault-cli"
path = "src/main.rs"

[dependencies]
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
aes-gcm = "0.10"
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
