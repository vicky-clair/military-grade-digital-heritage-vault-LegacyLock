name: Build & Release LegacyLock

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Package Windows (Installer & Portable)
        if: runner.os == 'Windows'
        run: npx electron-builder --win

      - name: Package Linux (AppImage, deb, tar.gz)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage deb tar.gz

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: legacylock-${{ runner.os }}
          path: release/*.*
